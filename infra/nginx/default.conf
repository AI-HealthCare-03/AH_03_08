limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

upstream fastapi {
    server fastapi:8000;
}

server {
    server_name localhost EC2_IP;
    listen 80;

    # 악성 User-Agent 차단
    if ($http_user_agent ~* (terrabot|libredtail|zgrab|masscan|nmap|sqlmap|nikto|scanner)) {
        return 444;
    }

    # 민감 파일 접근 차단 (연결 즉시 끊기)
    location ~* \.(env|git|sql|bak|backup|sh|conf|ini|log|key|pem)$ {
        return 444;
    }

    # 숨김 파일/폴더 접근 차단
    location ~ /\. {
        return 444;
    }

    # 알려진 취약점 경로 차단
    location ~* /(wp-config|phpinfo|eval-stdin|GponForm|boaform|phpmyadmin|shell|vendor/phpunit|actuator/env|actuator/health|containers/json) {
        return 444;
    }

    # Let's Encrypt 인증
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API 요청 (Rate Limit 적용)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 나머지 모든 요청 차단
    location / {
        root /vol/web/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}