services:
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - ${DB_EXPOSE_PORT}:${DB_PORT}
    networks:
      - ws
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --port=${DB_PORT}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    container_name: fastapi
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    env_file: .env
    environment:
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
    volumes:
      - static_volume:/app/templates
      - media_volume:/app/media
      - uploads_tmp:/tmp/uploads
      - /home/ubuntu/project/data:/app/data
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    container_name: ai-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    env_file: .env
    environment:
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
    command: uv run --no-sync celery -A ai_worker.celery_app worker -Q image -c 2 --loglevel=info
    restart: always
    mem_limit: 4G
    volumes:
      - uploads_tmp:/tmp/uploads
      - /home/ubuntu/project/data:/app/data
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  llm-worker:
    container_name: llm-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    env_file: .env
    environment:
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
    command: uv run --no-sync celery -A ai_worker.celery_app worker -Q llm,tts -c 2 --loglevel=info
    restart: always
    mem_limit: 4G
    volumes:
      - chroma_data:/data/chromadb
      - /home/ubuntu/project/data:/app/data
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    container_name: celery-beat
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    env_file: .env
    environment:
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
    command: uv run --no-sync celery -A ai_worker.celery_app beat --loglevel=info
    restart: always
    networks:
      - ws
    depends_on:
      - redis

  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
      - frontend_dist:/vol/web/frontend
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ws
    depends_on:
      - fastapi

  certbot:
    image: certbot/certbot
    container_name: auto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  mysql_data:
    name: mysql_data
  static_volume:
    name: static_volume
  media_volume:
    name: media_volume
  chroma_data:
    name: chroma_data
  uploads_tmp:
    name: uploads_tmp
  certbot-conf:
    name: certbot-conf
  certbot-www:
    name: certbot-www
  frontend_dist:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/project/frontend_dist

networks:
  ws:
    name: ws
    driver: bridge