[project]
name = "ai-health-example"
version = "0.1.0"
description = "AI ?ъ뒪耳???뚯씠???꾨줈?앺듃 ?덉떆??
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery-types>=0.26.0",
    "cryptography>=46.0.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0.post0",
    "redis>=7.1.0",
    "tomlkit>=0.14.0",
    "Pillow>=10.0.0",
]

[dependency-groups]
ai = [
    "scikit-learn>=1.8.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio",
    "sentence-transformers>=5.2.0",
    "httpx>=0.28.1",
    "boto3>=1.0.0",
    "tortoise-orm",
    "asyncmy>=0.2.11",
    # LLM
    "anthropic>=0.51.0",
    "langchain>=0.3.25",
    "langchain-anthropic>=0.3.15",
    "langchain-chroma>=0.2.4",
    "langchain-community>=0.3.23",
    "langchain-core>=0.3.59",
    "langchain-openai>=0.3.0",
    "chromadb>=0.6.3",
    "celery>=5.4.0",
    # Image
    "Pillow>=10.0.0",
    "openai>=1.0.0",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.0.3",
]
app = [
    "aerich>=0.9.2",
    "asyncmy>=0.2.11",
    "celery>=5.4.0",
    "email-validator>=2.0.0",
    "bcrypt<=4.0.1",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "boto3>=1.0.0",
    "openai>=1.0.0",
    "orjson>=3.11.5",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=11.0.0",
    "pyjwt>=2.10.1",
    "tortoise-orm>=0.25.3",
    "uvicorn>=0.40.0",
]
eval = [
    "langchain-core>=0.3.59",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "coverage>=7.13.2",
    "mypy>=1.19.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "types-passlib>=1.7.7.20250602",
    "types-python-dateutil>=2.9.0.20260124",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.aerich]
tortoise_orm = "app.core.db.databases.TORTOISE_ORM"
location = "./app/core/db/migrations"
src_folder = "./."

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "no_db: Tortoise MySQL 珥덇린???놁씠 ?ㅽ뻾?섎뒗 ?쒖닔 unit ?뚯뒪??,
]

[tool.ruff]
# 湲곕낯 ?쇱씤 湲몄씠 ?ㅼ젙
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# ?ъ슜??由고듃 洹쒖튃???좏깮
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["UP046", "E501", "B008", "N802"]

# ?뱀젙 ?뚯씪?먯꽌 臾댁떆??洹쒖튃??
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"db/migrations/*" = ["ALL"]

[tool.ruff.format]
# ?щℓ???ㅼ젙
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
